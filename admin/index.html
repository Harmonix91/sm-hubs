<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F4A5E">
<title>Control Room | Sonder &amp; Metric</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230F4A5E'/%3E%3Ctext x='32' y='46' font-family='Poppins,Helvetica,Arial,sans-serif' font-size='42' font-weight='600' fill='%23FFFFFF' text-anchor='middle'%3E%26amp;%3C/text%3E%3C/svg%3E">
<style>
  :root{--teal:#0F4A5E;--teal2:#0b3a4a;--orange:#DB6F2A;--paper:#F6F8F9;--ink:#1C2E38;--mist:#9FB7C0;
    --bg:#F6F8F9;--card:#fff;--muted:#5d727c;--line:#dfe7ea;--ok:#1f7a4a;--kill:#b2402f;--accent:#DB6F2A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--teal)}
  /* layout */
  .shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
  .side{background:var(--teal);color:#fff;padding:26px 22px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{font-size:19px;font-weight:600;letter-spacing:.01em}
  .brand small{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-top:4px}
  .sidenav{display:flex;flex-direction:column;gap:4px;margin:28px 0 8px}
  .sidenav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:10px;color:rgba(255,255,255,.72);font-weight:500;font-size:14px}
  .sidenav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .sidenav button.on{background:#fff;color:var(--teal);font-weight:600}
  .sidenav button.on .dot.g{box-shadow:0 0 0 2px #fff}
  .keyhead{margin:30px 0 10px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange);font-weight:600}
  .keywrap>summary{list-style:none;cursor:pointer}
  .keywrap>summary::-webkit-details-marker{display:none}
  .keywrap>summary::after{content:" ▸";color:rgba(255,255,255,.5)}
  .keywrap[open]>summary::after{content:" ▾"}
  .week{margin:0 0 6px}
  .wrow{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:rgba(255,255,255,.85);font-weight:300}
  .wday{font-weight:600;color:var(--orange);font-size:12px;letter-spacing:.04em}
  .wrow em{display:block;font-style:normal;color:#fff;font-weight:500;margin-top:2px}
  .keyintro{font-size:12.5px;color:rgba(255,255,255,.6);font-weight:300;margin:0 0 12px}
  .kjob{border-top:1px solid rgba(255,255,255,.12);padding:12px 0}
  .kjob summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .kjob summary::-webkit-details-marker{display:none}
  .kname{font-weight:600;font-size:14px}
  .kwhen{font-size:11.5px;color:var(--orange);white-space:nowrap;font-weight:500}
  .krow{font-size:12.5px;color:rgba(255,255,255,.78);font-weight:300;margin-top:8px}
  .krow b{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600;margin-bottom:2px}
  .kflow{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .kflow span{background:rgba(255,255,255,.1);border-radius:99px;padding:1px 8px;font-size:11.5px;color:#fff}
  .kflow i{font-style:normal;color:var(--orange)}
  .sidefoot{margin-top:26px;font-size:12px;color:rgba(255,255,255,.5)}
  .sidefoot button{all:unset;cursor:pointer;color:#fff;text-decoration:underline;text-decoration-color:var(--orange);text-underline-offset:3px}
  .main{padding:34px 40px 70px;max-width:980px;width:100%}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
  .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:6px}
  h1{font-size:30px;margin:0;font-weight:600;letter-spacing:-.02em;color:var(--teal)}
  #who{font-size:13px;color:var(--muted)}
  .muted{color:var(--muted);font-size:13.5px}
  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,74,94,.04),0 6px 18px rgba(15,74,94,.05)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:11.5px;padding:2px 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--muted);font-weight:500}
  .chip.kind{background:rgba(219,111,42,.1);border-color:rgba(219,111,42,.35);color:#b5561b}
  h2{font-size:17px;margin:0 0 10px;font-weight:600;color:var(--ink)}
  .body p{margin:0 0 10px}
  .body strong{font-weight:600}
  .sources{font-size:12.5px;margin-top:8px;word-break:break-all;padding-top:10px;border-top:1px dashed var(--line)}
  .sources a,.body a{color:var(--teal);text-decoration-color:var(--orange);text-underline-offset:2px}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:14px;font-weight:500;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
  button:hover{border-color:var(--mist)}
  button.approve{background:var(--teal);border-color:var(--teal);color:#fff}
  button.approve:hover{background:var(--teal2)}
  button.kill{color:var(--kill);border-color:rgba(178,64,47,.35)}
  button:disabled{opacity:.5;cursor:default}
  textarea,input[type=email],input[type=text]{width:100%;font:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);outline:none}
  textarea:focus,input:focus,select:focus{border-color:var(--teal)}
  textarea{min-height:200px;margin-top:10px}
  input[type=date],input[type=file]{font:inherit;font-size:14px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
  .epform label{display:block;margin:12px 0 4px}
  .epform textarea{min-height:100px;margin-top:0}
  /* roles */
  .rolefilters .frow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .rolefilters select{font:inherit;font-size:13.5px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);flex:1 1 170px;min-width:0}
  .role{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px}
  .rtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .remp{font-weight:600;color:var(--teal)}
  .rtitle{margin:3px 0;font-weight:500}
  .rtitle a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--orange);text-underline-offset:3px}
  /* health */
  .health{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;background:#fff;font-size:14px}
  .health.good{border-left:4px solid var(--ok)} .health.bad,.health.warn{border-left:4px solid var(--kill)}
  .health.good strong{color:var(--ok)} .health.bad strong,.health.warn{color:var(--kill)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .dot.g{background:#3fbf7f} .dot.r{background:#e2604c}
  .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--orange);color:#fff;font-size:11.5px;line-height:20px;text-align:center;margin-left:6px;font-weight:600}
  .hday{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .hday summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none}
  .hday summary::-webkit-details-marker{display:none}
  .hday summary::after{content:"▸";float:right;color:var(--muted)}
  .hday[open] summary::after{content:"▾"}
  .hday[open] summary{background:var(--paper)}
  .hitem{border-top:1px solid var(--line);padding:12px 16px}
  .remedy{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(219,111,42,.08);border:1px solid rgba(219,111,42,.3);font-size:13.5px;color:var(--ink)}
  .remedy.done{background:rgba(31,122,74,.07);border-color:rgba(31,122,74,.3)}
  .remedy.done b{color:var(--ok)}
  .tick{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:500;font-size:13.5px;cursor:pointer}
  .tick input{width:18px;height:18px;accent-color:var(--teal);cursor:pointer}
  .remedy b{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b5561b;margin-bottom:3px}
  /* publish */
  .publish{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
  .publish input{flex:1 1 260px}
  /* sub tabs */
  .tabs{display:inline-flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
  .tabs button{border:none;background:transparent;color:var(--muted);padding:7px 14px;border-radius:9px}
  .tabs button.on{background:var(--teal);color:#fff}
  .status{font-size:12.5px;font-weight:600;text-transform:capitalize}
  .status.approved,.status.published{color:var(--ok)} .status.killed{color:var(--kill)}
  .empty{text-align:center;padding:50px 16px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
  .msg{padding:12px 14px;border-radius:12px;background:rgba(219,111,42,.08);border:1px solid rgba(219,111,42,.3);margin-bottom:16px;font-size:14px}
  /* sign in */
  .signin{max-width:440px}
  .signin button{margin-top:12px}
  .gate .side .sidenav,.gate .side .key,.gate #signout{display:none}
  /* mobile */
  @media(max-width:900px){
    .shell{grid-template-columns:1fr}
    .side{position:static;height:auto;padding:18px 16px 14px}
    .sidenav{flex-direction:row;flex-wrap:wrap;margin:14px 0 0}
    .sidenav button{padding:8px 12px}
    .key{margin-top:6px}
    .main{padding:22px 16px 60px}
    h1{font-size:24px}
  }
</style>
</head>
<body class="gate">
<div class="shell">
  <aside class="side">
    <div class="brand">Sonder &amp; Metric<small>Control room</small></div>
    <nav class="sidenav" id="nav" hidden><button data-m="queue" class="on">Approval queue</button><button data-m="roles">Roles</button><button data-m="movers">Movers</button><button data-m="episodes">Episodes</button><button data-m="health" id="healthnav">Health</button></nav>
    <div class="key" id="key"></div>
    <div class="sidefoot"><span id="who"></span><br><button id="signout" hidden>Sign out</button></div>
  </aside>
  <div class="main">
    <header>
      <div><div class="eyebrow" id="eyebrow">Daily review</div><h1 id="pagetitle">Approval queue</h1></div>
    </header>
    <div id="msg"></div>
    <main id="app"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://hmjebqoeqffqljfyasys.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtamVicW9lcWZmcWxqZnlhc3lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNjc2MzEsImV4cCI6MjEwNzg0MzYzMX0.OZMx5dlkf4yp0akhU92t_K5BDN2N9hDhZeh-PzF7B2g"; // public key; data is protected by row-level security
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
const msgEl = document.getElementById("msg");
let view = "pending";

let mode = "queue";
const KIND = {brief:"The Brief",newsletter:"Newsletter",movers:"Movers",news:"News",brief_section:"Brief",index_update:"Index",hub_email:"Hub email",linkedin_post:"LinkedIn",outreach:"Outreach",other:"Other"};
const HUB = {hr:"HR",operating_partners:"Operating Partners",cfo:"CFO",ceo:"CEO",investors:"Investors",all:"All hubs"};

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function md(s){return esc(s).split(/\n{2,}/).map(p=>"<p>"+p.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>")+"</p>").join("")}
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch{return null}}
function say(t){msgEl.innerHTML=t?'<div class="msg">'+esc(t)+'</div>':""}
function fmt(d){return new Date(d).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}

function signInForm(){
  document.getElementById("signout").hidden=true;
  document.getElementById("nav").hidden=true;
  document.body.classList.add("gate");
  document.getElementById("pagetitle").textContent="Sign in";
  document.getElementById("eyebrow").textContent="Sonder & Metric";
  document.getElementById("who").textContent="";
  app.innerHTML=`<div class="card signin">
    <p>Enter your work email. We'll send you a sign-in link.</p>
    <input type="email" id="email" placeholder="you@sonderandmetric.com" autocomplete="email">
    <button class="approve" id="send">Send link</button></div>`;
  document.getElementById("send").onclick=async()=>{
    const email=document.getElementById("email").value.trim().toLowerCase();
    if(!email) return;
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
    say(error?("Could not send the link: "+error.message):"Check your inbox for the sign-in link.");
  };
}

async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return signInForm();
  document.getElementById("signout").hidden=false;
  document.getElementById("who").textContent=session.user.email;
  const {data:admin}=await sb.from("admins").select("email").limit(1);
  if(!admin||!admin.length){app.innerHTML='<div class="empty">This account does not have access to the queue.</div>';return}
  document.getElementById("nav").hidden=false;
  document.body.classList.remove("gate"); renderKey();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
  document.getElementById("pagetitle").textContent={episodes:"Episodes",roles:"Roles",movers:"Movers",health:"Job health"}[mode]||"Approval queue";
  document.getElementById("eyebrow").textContent={episodes:"Podcast transcripts",roles:"Leadership Signals Index",movers:"Senior appointments",health:"Scheduled jobs"}[mode]||"Daily review";
  updateHealthNav();
  if(mode==="health") return loadHealth();
  if(mode==="movers") return loadMovers();
  if(mode==="episodes") return loadEpisodes();
  if(mode==="roles") return loadRoles();

  let q=sb.from("drafts").select("*");
  if(view==="pending") q=q.eq("status","pending").order("created_at",{ascending:true});
  else if(view==="ready") q=q.eq("status","approved").eq("kind","newsletter").is("published_url",null).order("created_at",{ascending:true});
  else q=q.neq("status","pending").gte("decided_at",new Date(Date.now()-7*864e5).toISOString()).order("decided_at",{ascending:false});
  const {data,error}=await q.limit(200);
  if(error){say("Could not load drafts: "+error.message);return}

  const tb=(v,l)=>`<button data-v="${v}" class="${view===v?"on":""}">${l}</button>`;
  const tabs=`<div class="tabs">${tb("pending","To review")}${tb("ready","Ready to publish")}${tb("done","Decided, last 7 days")}</div>`;
  const emptyMsg={pending:"Nothing waiting. All clear.",ready:"No approved newsletters waiting to go on LinkedIn.",done:"No decisions in the last 7 days."}[view];
  if(!data.length){app.innerHTML=tabs+`<div class="empty">${emptyMsg}</div>`;bindTabs();return}
  app.innerHTML=tabs+`<div class="muted" style="margin-bottom:10px">${data.length} item${data.length>1?"s":""}</div>`+data.map(card).join("");
  bindTabs(); bindCards();
}

// ---------- Key: what runs, when, what it gathers, where it goes ----------
const JOBS=[
  {name:"Index scan",when:"Tue and Fri 16:00",
   gathers:"Senior roles (Head of, Director, C-suite) in the UK and Ireland only, at the 214 watchlist employers (121 read free from job feeds and careers pages, 93 via Hyreflow) plus a UK and Ireland wider-market sweep and HR pass.",
   flow:["Roles tab","Index headline + signals in queue","The Brief: Index and signals","HR hub"]},
  {name:"Movers scan",when:"Mon to Fri 16:15",
   gathers:"Senior appointments and departures from 13 trade press people pages (reNEWS, Energy Voice, Infrastructure Investor and others) and 156 watchlist newsrooms. Saves each move with the seat it leaves open; flags people already in Atlas. For approved moves of people in Atlas, creates a congratulations task.",
   flow:["Movers tab","Atlas congratulations tasks"]},
  {name:"News check",when:"Mon to Fri 16:30",
   gathers:"UK and European energy, utilities and infrastructure news since the last run: appointments, deals, exits, restructures, regulation. Scored 1 to 5 against your ICP; companies checked in Atlas.",
   flow:["News items","Approval queue (score 3+)","The Brief: stories","Hub emails"]},
  {name:"Movers draft",when:"Thu 17:30",
   gathers:"The week's best 5 to 12 moves, grouped by function, HR first. Approve before Friday's Brief.",
   flow:["Movers draft in queue","The Brief: Movers","Hub Movers sections"]},
  {name:"Brief draft",when:"Fri 17:30",
   gathers:"The week's Index headline, signals, Movers and news. If fewer than 3 stories, it researches more. Leaves From my desk for you.",
   flow:["One Brief draft in queue","On approval: /brief archive, Mon 07:00","Kit email (to come)"]},
  {name:"Sunday top-up",when:"Sun 21:00, optional",
   gathers:"Weekend news. If the Brief is still awaiting approval, adds up to 2 significant stories to it. If already approved, holds them for next week. If the laptop is closed, Friday's Brief stands.",
   flow:["News in queue","The Brief (if not yet approved)"]},
  {name:"Newsletter draft",when:"Mon 08:00",
   gathers:"Tomorrow's (Tuesday's) podcast episode transcript from the Episodes tab, plus one market theme from the week's news and Index. Sarah uploads the transcript beforehand.",
   flow:["Newsletter draft in queue","Ready to publish","You post on LinkedIn, Fri"]},
  {name:"Health check",when:"Hourly, and 09:00 daily",
   gathers:"Whether each job above ran on time. Runs stuck over 3 hours are marked failed. Runs on the database, so it works when the Mac is asleep.",
   flow:["Health tab","Badge on the Health button"]}
];
const WEEK=[
  {d:"Mon",t:"07:00 The Brief goes out (once approved). 08:00 newsletter drafted from Tuesday's episode.",who:"Sarah: transcript in Episodes first"},
  {d:"Tue",t:"Solving Infrastructure podcast episode goes out. 16:00 Index scan."},
  {d:"Wed",t:"Daily scans from 16:00."},
  {d:"Thu",t:"17:30 Movers drafted.",who:"You: approve Movers"},
  {d:"Fri",t:"Solving Infrastructure newsletter on LinkedIn. 16:00 Index scan. 17:30 Brief drafted.",who:"You: post newsletter, approve Brief by Sunday"},
  {d:"Sun",t:"21:00 optional weekend top-up to the Brief."},
  {d:"Daily",t:"Mon to Fri: Movers scan 16:15, News check 16:30."}
];
function renderKey(){
  const k=document.getElementById("key"); if(k.dataset.done)return; k.dataset.done=1;
  const jobs=JOBS.map(j=>`<details class="kjob"><summary><span class="kname">${esc(j.name)}</span><span class="kwhen">${esc(j.when)}</span></summary>
    <div class="krow"><b>Gathers</b>${esc(j.gathers)}</div>
    <div class="krow"><b>Feeds into</b><div class="kflow">${j.flow.map(esc).map(s=>`<span>${s}</span>`).join('<i>→</i>')}</div></div></details>`).join("");
  const week=WEEK.map(w=>`<div class="wrow"><span class="wday">${esc(w.d)}</span><span>${esc(w.t)}${w.who?` <em>${esc(w.who)}</em>`:""}</span></div>`).join("");
  k.innerHTML=`<details class="keywrap"${window.innerWidth>900?" open":""}><summary class="keyhead">The week</summary><div class="week">${week}</div></details>
  <details class="keywrap"${window.innerWidth>900?" open":""}><summary class="keyhead">How it runs</summary><p class="keyintro">Every job drafts into the queue. Nothing is published or sent without your approval. Jobs run while Claude is open on the Mac; if it was closed, a missed job runs when Claude next opens. Tap a job for detail.</p>${jobs}</details>`;
}

const GOOD=["ok","partial","running"];
const HLABEL={ok:"Ran",partial:"Ran with gaps",running:"Running now",failed:"Failed",stalled:"Stalled",missed:"Did not run"};
let healthCache=null;
async function getHealth(force){
  if(healthCache&&!force&&Date.now()-healthCache.t<60000) return healthCache.d;
  const {data,error}=await sb.rpc("health_summary");
  if(error||!data) return null;
  healthCache={t:Date.now(),d:data}; return data;
}
async function updateHealthNav(){
  const d=await getHealth(), b=document.getElementById("healthnav");
  if(!d){b.textContent="Health";return}
  const n=d.jobs.filter(j=>!GOOD.includes(j.state)&&!j.resolved).length;
  b.innerHTML=n?`Health <span class="badge">${n}</span>`:'Health <span class="dot g" style="margin:0 0 1px 4px"></span>';
}
async function loadHealth(){
  app.innerHTML='<p class="muted">Checking jobs…</p>';
  const d=await getHealth(true);
  if(!d){app.innerHTML='<div class="health warn">Job health could not be checked just now.</div>';return}
  updateHealthNav();
  const bad=d.jobs.filter(j=>!GOOD.includes(j.state)&&!j.resolved);

// Rich HTML for pasting into LinkedIn's article editor
function inl(t){return t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2">$1</a>')}
function richHtml(src){
  const lines=esc(src).split("\n");let html="",list=false,para=[];
  const flush=()=>{if(para.length){html+="<p>"+inl(para.join(" "))+"</p>";para=[]}};
  for(const raw of lines){const l=raw.trim();
    if(/^[-*] /.test(l)){flush();if(!list){html+="<ul>";list=true}html+="<li>"+inl(l.slice(2))+"</li>";continue}
    if(list){html+="</ul>";list=false}
    if(!l){flush();continue}
    const h=l.match(/^(#{1,3})\s+(.*)$/);
    if(h){flush();html+=h[1].length===1?`<h1>${inl(h[2])}</h1>`:`<h2>${inl(h[2])}</h2>`;continue}
    const b=l.match(/^\*\*(.+)\*\*:?$/);
    if(b){flush();html+=`<h2>${b[1]}</h2>`;continue}
    para.push(l)}
  flush();if(list)html+="</ul>";return html}
function plainText(src){return src.replace(/\*\*(.+?)\*\*/g,"$1").replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,"$1 ($2)").replace(/^#{1,3}\s+/gm,"")}
async function copyForLinkedIn(text){
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([richHtml(text)],{type:"text/html"}),"text/plain":new Blob([plainText(text)],{type:"text/plain"})})]);
    say("Copied with formatting. In LinkedIn: Write article, choose the Solving Infrastructure newsletter, paste, add a cover image, then schedule for Friday.");
  }catch(e){
    const ta=document.createElement("textarea");ta.value=plainText(text);document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
    say("Copied as plain text (this browser blocked formatted copy). Headings and bold will need setting in LinkedIn.");
  }
}

function bindCards(){
  app.querySelectorAll(".card[data-id]").forEach(el=>{
    const id=+el.dataset.id;
    const pc=el.querySelector('button[data-p="copy"]'), pm=el.querySelector('button[data-p="mark"]');
    if(pc) pc.onclick=async()=>{const {data}=await sb.from("drafts").select("body,edited_body").eq("id",id).single(); if(data) copyForLinkedIn(data.edited_body||data.body)};
    if(pm) pm.onclick=async()=>{
      const u=el.querySelector('input[data-p="url"]').value.trim();
      if(!/^https:\/\/([a-z]+\.)?linkedin\.com\//i.test(u)){say("Paste the LinkedIn link of the published or scheduled article first.");return}
      pm.disabled=true;
      const {data,error}=await sb.from("drafts").update({published_url:u,published_at:new Date().toISOString()}).eq("id",id).select("id");
      if(error||!data||!data.length){pm.disabled=false;say("Could not save: "+(error?error.message:"no permission"));return}
      say("Marked as published."); load();
    };
    el.querySelectorAll("button[data-a]").forEach(b=>b.onclick=async()=>{
      const a=b.dataset.a;
      if(a==="approve") return decide(el,id,{status:"approved"});
      if(a==="kill"){const note=prompt("Why kill it? (optional)");if(note===null)return;return decide(el,id,{status:"killed",decision_note:note||null})}
      if(a==="edit"){
        const ed=el.querySelector(".editor");
        if(ed.innerHTML){ed.innerHTML="";return}
        const {data}=await sb.from("drafts").select("body,edited_body").eq("id",id).single();
        ed.innerHTML=`<textarea>${esc(data.edited_body||data.body)}</textarea><div class="actions"><button class="approve" data-s="1">Save and approve</button><button data-s="0">Save draft</button></div>`;
        ed.querySelectorAll("button").forEach(sbtn=>sbtn.onclick=()=>{
          const text=ed.querySelector("textarea").value;
          decide(el,id,sbtn.dataset.s==="1"?{status:"approved",edited_body:text}:{edited_body:text},sbtn.dataset.s!=="1");
        });
      }
    });
  });
}

async function decide(el,id,patch,stay){
  el.querySelectorAll("button").forEach(b=>b.disabled=true);
  const {data,error}=await sb.from("drafts").update(patch).eq("id",id).select("id");
  if(error||!data||!data.length){say("Could not save: "+(error?error.message:"no permission"));el.querySelectorAll("button").forEach(b=>b.disabled=false);return}
  say(stay?"Edit saved.":patch.status==="approved"?"Approved.":"Killed.");
  load();
}

const FN={ceo:"CEO",cfo:"CFO",coo:"COO",cco:"CCO",cio:"CIO / investment",hr:"HR / People",asset_management:"Asset management",portfolio_management:"Portfolio management",programme_management:"Programme management",construction:"Construction",strategy:"Strategy",origination:"Origination",commercial:"Commercial",operations:"Operations",engineering:"Engineering",regulation:"Regulation",hse:"HSE",legal:"Legal",other:"Other"};
const LV={c_suite:"C-suite",director:"Director",head_of:"Head of",other:"Other"};
let roleRows=[], rf={q:"",fn:"",sector:"",scope:"",state:"open",sig:"",sort:"new"};

async function loadRoles(){

function roleFilters(){
  const sectors=[...new Set(roleRows.map(r=>r.sector).filter(Boolean))].sort();
  const fns=[...new Set(roleRows.map(r=>r.function).filter(Boolean))].sort((a,b)=>(FN[a]||a).localeCompare(FN[b]||b));
  const opt=(v,l,cur)=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`;
  return `<div class="card rolefilters">
    <input type="text" id="rq" placeholder="Search employer or title" value="${esc(rf.q)}">
    <div class="frow">
      <select id="rfn">${opt("","All functions",rf.fn)}${fns.map(f=>opt(f,FN[f]||f,rf.fn)).join("")}</select>
      <select id="rsector">${opt("","All sectors",rf.sector)}${sectors.map(s=>opt(s,s,rf.sector)).join("")}</select>
      <select id="rscope">${opt("","Watchlist and wider market",rf.scope)}${opt("watch","Watchlist only",rf.scope)}${opt("wider","Wider market only",rf.scope)}</select>
      <select id="rstate">${opt("open","Open roles",rf.state)}${opt("closed","Closed roles",rf.state)}${opt("all","Open and closed",rf.state)}</select>
      <select id="rsig">${opt("","Any signal",rf.sig)}${opt("repost","Reposted",rf.sig)}${opt("60","Open 60+ days",rf.sig)}${opt("csuite","C-suite",rf.sig)}${opt("multi","Employers with 2+ open roles",rf.sig)}${opt("new7","New in last 7 days",rf.sig)}</select>
      <select id="rsort">${opt("new","Newest first",rf.sort)}${opt("days","Longest open first",rf.sort)}${opt("emp","Employer A–Z",rf.sort)}</select>
    </div>
    <div class="actions" style="margin-top:8px"><button data-quick="hr">HR roles</button><button data-quick="reset">Clear filters</button><button data-quick="csv">Download CSV</button></div>
  </div>`;
}

function filteredRoles(){
  const q=rf.q.trim().toLowerCase(), week=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const openCount={}; roleRows.forEach(r=>{if(!r.closed_on)openCount[r.employer]=(openCount[r.employer]||0)+1});
  let rows=roleRows.filter(r=>{
    if(q&&!(`${r.employer} ${r.role_title}`.toLowerCase().includes(q)))return false;
    if(rf.fn&&r.function!==rf.fn)return false;
    if(rf.sector&&r.sector!==rf.sector)return false;
    if(rf.scope==="watch"&&!r.on_watchlist)return false;
    if(rf.scope==="wider"&&r.on_watchlist)return false;
    if(rf.state==="open"&&r.closed_on)return false;
    if(rf.state==="closed"&&!r.closed_on)return false;
    if(rf.sig==="repost"&&!(r.repost_count>0))return false;
    if(rf.sig==="60"&&!(r.days_open>=60))return false;
    if(rf.sig==="csuite"&&r.level!=="c_suite")return false;
    if(rf.sig==="multi"&&!(openCount[r.employer]>=2))return false;
    if(rf.sig==="new7"&&!(r.first_seen>=week))return false;
    return true});
  if(rf.sort==="days")rows.sort((a,b)=>(b.days_open||0)-(a.days_open||0));
  else if(rf.sort==="emp")rows.sort((a,b)=>a.employer.localeCompare(b.employer));
  return rows;
}

function renderRoles(){
  const rows=filteredRoles();
  const open=roleRows.filter(r=>!r.closed_on).length, hr=roleRows.filter(r=>!r.closed_on&&r.function==="hr").length;
  const list=rows.slice(0,400).map(r=>{
    const u=safeUrl(r.url);
    return `<div class="role">
      <div class="rtop"><span class="remp">${esc(r.employer)}</span>${r.on_watchlist?'<span class="chip kind">Watchlist</span>':''}${r.closed_on?'<span class="chip">Closed '+esc(fmtDate(r.closed_on))+'</span>':''}${r.repost_count>0?'<span class="chip" style="color:var(--kill);border-color:var(--kill)">Reposted ×'+r.repost_count+'</span>':''}</div>
      <div class="rtitle">${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(r.role_title)}</a>`:esc(r.role_title)}</div>
      <div class="muted">${esc(LV[r.level]||r.level||"")} · ${esc(FN[r.function]||r.function||"")} · ${esc(r.sector||"")} · ${esc(r.location||r.country||"")}</div>
      <div class="muted">First seen ${esc(fmtDate(r.first_seen))} · ${r.days_open??0} days open · seen ${r.times_seen||1}×</div>
    </div>`}).join("");
  app.innerHTML=roleFilters()+`<div class="muted" style="margin:6px 0 10px">${rows.length} of ${roleRows.length} roles shown · ${open} open in total · ${hr} open HR roles${rows.length>400?" · showing the first 400":""}</div>`+(list||'<div class="empty">No roles match these filters.</div>');
  const bind=(id,key,ev="change")=>{const el=document.getElementById(id);el.addEventListener(ev,()=>{rf[key]=el.value;renderRoles(); if(ev==="input"){const n=document.getElementById(id);n.focus();n.setSelectionRange(n.value.length,n.value.length)}})};
  bind("rq","q","input");bind("rfn","fn");bind("rsector","sector");bind("rscope","scope");bind("rstate","state");bind("rsig","sig");bind("rsort","sort");
  app.querySelectorAll("button[data-quick]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.quick;
    if(k==="hr"){rf={...rf,fn:"hr",state:"open"};renderRoles()}
    else if(k==="reset"){rf={q:"",fn:"",sector:"",scope:"",state:"open",sig:"",sort:"new"};renderRoles()}
    else if(k==="csv"){
      const cols=["employer","role_title","level","function","sector","country","location","on_watchlist","first_seen","last_seen","closed_on","days_open","times_seen","repost_count","url"];
      const csv=[cols.join(",")].concat(filteredRoles().map(r=>cols.map(c=>`"${String(r[c]??"").replace(/"/g,'""')}"`).join(","))).join("\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="roles-"+new Date().toISOString().slice(0,10)+".csv";a.click();
    }});
}

      <h2>${esc(e.title)}</h2>
      <div class="muted">${esc(e.guest_name)}${e.guest_role?", "+esc(e.guest_role):""}${e.guest_company?", "+esc(e.guest_company):""}</div>
      ${e.transcript_filename?`<div class="muted">File: ${esc(e.transcript_filename)}</div>`:""}
      <div class="actions"><button data-edit="${e.id}">Edit or replace transcript</button></div>
      <div class="editor"></div></div>`}).join("");
  app.innerHTML=`<div class="card"><h2>Add an episode</h2>${epForm({publish_date:nextTuesday()})}</div>`+(rows||'<div class="empty">No episodes yet.</div>');
  bindEpForm(app.querySelector(".card"),null);
  app.querySelectorAll("button[data-edit]").forEach(b=>b.onclick=async()=>{
    const card=b.closest(".card"),ed=card.querySelector(".editor");
    if(ed.innerHTML){ed.innerHTML="";return}
    const {data:e}=await sb.from("episodes").select("*").eq("id",+b.dataset.edit).single();
    ed.innerHTML=epForm(e); bindEpForm(ed,e.id);
  });
}

function epForm(e){
  return `<div class="epform">
    <label class="muted">Publish date (Tuesday)</label><input type="date" name="publish_date" value="${esc(e.publish_date||"")}">
    <label class="muted">Episode title</label><input type="text" name="title" value="${esc(e.title||"")}">
    <label class="muted">Guest name</label><input type="text" name="guest_name" value="${esc(e.guest_name||"")}">
    <label class="muted">Guest role</label><input type="text" name="guest_role" value="${esc(e.guest_role||"")}">
    <label class="muted">Guest company</label><input type="text" name="guest_company" value="${esc(e.guest_company||"")}">
    <label class="muted">Episode link (once live, optional)</label><input type="text" name="episode_url" value="${esc(e.episode_url||"")}">
    <label class="muted">Transcript from Riverside: choose the .txt or .srt file${e.transcript_filename?" (current: "+esc(e.transcript_filename)+")":""}</label><input type="file" name="file" accept=".txt,.srt,.vtt,text/plain">
    <label class="muted">Or paste the transcript</label><textarea name="transcript" placeholder="Paste here if you are not uploading a file"></textarea>
    <label class="muted">Notes for the newsletter (optional)</label><input type="text" name="notes" value="${esc(e.notes||"")}">
    <div class="actions"><button class="approve" data-save="1">Save episode</button></div></div>`;
}

function bindEpForm(root,id){
  root.querySelector("button[data-save]").onclick=async(ev)=>{
    const btn=ev.target, f=n=>root.querySelector(`[name=${n}]`);
    const rec={publish_date:f("publish_date").value,title:f("title").value.trim(),guest_name:f("guest_name").value.trim(),guest_role:f("guest_role").value.trim()||null,guest_company:f("guest_company").value.trim()||null,episode_url:f("episode_url").value.trim()||null,notes:f("notes").value.trim()||null};
    if(!rec.publish_date||!rec.title||!rec.guest_name){say("Publish date, title and guest name are needed.");return}
    if(new Date(rec.publish_date+"T12:00:00").getDay()!==2&&!confirm("That date is not a Tuesday. Save anyway?"))return;
    const file=f("file").files[0], pasted=f("transcript").value.trim();
    if(file){
      if(/\.docx?$|\.pdf$/i.test(file.name)){say("Please export the transcript from Riverside as .txt or .srt.");return}
      rec.transcript=await file.text(); rec.transcript_filename=file.name;
    } else if(pasted){rec.transcript=pasted; rec.transcript_filename="pasted"}
    btn.disabled=true;
    const q=id?sb.from("episodes").update(rec).eq("id",id):sb.from("episodes").insert(rec);
    const {error}=await q.select("id");
    btn.disabled=false;
    if(error){say("Could not save: "+(/duplicate/i.test(error.message)?"there is already an episode on that date.":error.message));return}
    say("Episode saved."); loadEpisodes();
  };
}

document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;say("");load()});
document.getElementById("signout").onclick=async()=>{await sb.auth.signOut();say("");signInForm()};
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"){history.replaceState(null,"",location.pathname);load()}});
load();
</script>
